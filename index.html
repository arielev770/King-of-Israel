const cp=[[-38,-30],[-40,-70],[-30,-52],[-20,-78],[-10,-52],[0,-88],[10,-52],[20,-78],[30,-52],[40,-70],[38,-30]];
c.save();c.shadowColor='rgba(0,0,0,.55)';c.shadowBlur=8;c.beginPath();cp.forEach(([x,y],i)=>c[i?'lineTo':'moveTo'](cx+x,hy+y));c.closePath();c.fillStyle=gold(c,cx-40,0,cx+40,0);c.fill();c.restore();

[[-40,-70],[-20,-78],[0,-88],[20,-78],[40,-70]].forEach(([x,y])=>gem(c,cx+x,hy+y-3,4,'#f4f4ff'));
gem(c,cx,hy-36.5,6,'#ff1744');gem(c,cx-17,hy-36.5,4.5,'#2979ff');gem(c,cx+17,hy-36.5,4.5,'#2979ff');gem(c,cx-31,hy-36.5,3.5,'#00e676');gem(c,cx+31,hy-36.5,3.5,'#00e676');

function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);u=Math.min(W/390,H/780);w=W/u;h=H/u;stD=$('sa').offsetHeight/u;

const r=scene(bgx,w,h);SX=r.x;SY=r.y;TX=w/2-85+26;TY=stD+34}

let ac,master,mus,lp,nb,nextT=0,step=0,muted=false;
const N=96,SD=.19,ML=[],mf=n=>440*Math.pow(2,(n-69)/12);
const MEL=[[74,1],[74,1],[76,1],[77,1],[79,2],[77,1],[76,1],[77,2],[76,2],[74,4],[73,1],[73,1],[74,1],[76,1],[77,2],[76,1],[74,1],[73,2],[70,2],[69,4],[74,1],[74,1],[76,1],[77,1],[79,2],[81,1],[79,1],[77,2],[76,2],[74,2],[69,2],[70,1],[73,1],[74,2],[73,1],[70,1],[69,2],[74,6],[0,2],[81,1],[81,1],[81,1],[79,1],[77,1],[77,1],[77,1],[76,1],[74,1],[74,1],[74,1],[76,1],[77,2],[74,2],[76,1],[76,1],[76,1],[77,1],[79,1],[77,1],[76,1],[73,1],[74,2],[73,2],[69,4]];
const CH='DDAADDADDDAA',CD={D:[50,[62,65,69]],A:[45,[61,64,67]]};
{let s=0;MEL.forEach(e=>{ML[s]=e;s+=e[1]})}
function tone(type,f,t,d,v,dst){const o=ac.createOscillator(),n=ac.createGain();o.type=type;o.frequency.value=f;n.gain.setValueAtTime(.0001,t);n.gain.exponentialRampToValueAtTime(v,t+.008);n.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(n);n.connect(dst);o.start(t);o.stop(t+d+.02)}
function hat(t,v,fr){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),n=ac.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=fr||7000;n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.0001,t+.07);s.connect(f);f.connect(n);n.connect(master);s.start(t);s.stop(t+.08)}
function sched(){if(!ac)return;if(nextT<ac.currentTime)nextT=ac.currentTime+.05;
while(nextT<ac.currentTime+.3){const k=step%N,e=ML[k],c=CD[CH[(k/8)|0]],t=nextT;
if(e&&e[0]){const f=mf(e[0]),d=e[1]*SD;tone('square',f,t,d*.92,.07,lp);tone('triangle',f,t,d*.92,.1,lp)}
if(k%2==0)tone('triangle',mf(c[0]),t,SD*.9,.28,mus);else{c[1].forEach(n=>tone('square',mf(n),t,SD*.45,.03,lp));hat(t,.04)}
nextT+=SD;step++}}
function initAudio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null;return}

mus=ac.createGain();mus.gain.value=.55;mus.connect(master);lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;lp.connect(mus);
nb=ac.createBuffer(1,ac.sampleRate*.1|0,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;
nextT=ac.currentTime+.1;setInterval(sched,60)}
function coinSfx(){if(!ac)return;const t=ac.currentTime,sc=[0,2,4,7,9,12,14,16];
for(let i=0;i<18;i++){const n=84+sc[R()*8|0],tt=t+i*.045+R()*.02;tone('sine',mf(n),tt,.5,.12,master);tone('triangle',mf(n+12),tt,.25,.04,master);if(i%3==0)hat(tt,.05,9000)}

function winSfx(){if(!ac)return;const t=ac.currentTime;[72,76,79,84,88,91,96,100].forEach((n,i)=>{tone('triangle',mf(n),t+i*.13,.9,.14,master);tone('sine',mf(n+12),t+i*.13,.6,.06,master)});[72,76,79,84].forEach(n=>tone('square',mf(n),t+1.1,1.6,.05,master))}
function pingSfx(){if(ac)tone('sine',mf(96+(R()*5|0)*2),ac.currentTime,.18,.06,master)}
function missSfx(){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),n=ac.createGain();o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(90,t+.12);n.gain.setValueAtTime(.12,t);n.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(n);n.connect(master);o.start(t);o.stop(t+.15)}

function burst(x,y,n){for(let i=0;i<n;i++){const k=i%3==0?1:0;sparks.push({x:x+(R()-.5)*40,y,vx:(R()-.5)*460,vy:-R()*480-40,l:0,m:.7+R()*.7,c:k?'#ffcc33':['#ffe27a','#fff','#9fe8ff'][i%3],r:1.5+R()*2.5,g:900,k})}}
function spawn(){for(let i=0;i<5;i++){const a=-PI/2+(i-2)*.5+(R()-.5)*.3,v=260+R()*160;parts.push({x:bxx,y:byy-30,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,d:.45+i*.06,sp:0,r:17+R()*3,rot:R()*6})}burst(bxx,byy-25,40)}
function showWin(){fin=true;run=false;$('start').style.display='none';$('win').style.display='flex';winSfx()}
function tap(px,py){if(!run||openT>0||won)return;const x=px/u,y=py/u;
if(Math.abs(x-bxx)<BWs/2+16&&Math.abs(y-byy)<BHs/2+18){openT=.001;total+=5;ls.set(total);if(total>=GOAL)won=true;speed=Math.min(5,speed*1.07);spawn();coinSfx()}
else{missSfx();for(let i=0;i<6;i++)sparks.push({x,y,vx:(R()-.5)*160,vy:(R()-.5)*160,l:0,m:.35,c:'#ddd',r:2,g:0,k:0})}}
cv.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches)tap(t.clientX,t.clientY)},{passive:false});
cv.addEventListener('mousedown',e=>tap(e.clientX,e.clientY));

document.addEventListener('visibilitychange',()=>{if(ac)document.hidden?ac.suspend():ac.resume()});
$('snd').onclick=()=>{muted=!muted;$('snd').textContent=muted?'🔇':'🔊';if(master)master.gain.setTargetAtTime(muted?0:.85,ac.currentTime,.05)};
$('play').onclick=()=>{initAudio();if(ac)ac.resume();$('start').style.display='none';run=true;hintT=6};
$('again').onclick=()=>{total=shown=0;ls.set(0);speed=1;won=fin=false;openT=0;parts.length=0;$('win').style.display='none';initAudio();if(ac)ac.resume();run=true;hintT=6};
if(total>=GOAL){won=true;fin=true;$('start').style.display='none';$('win').style.display='flex'}
else if(total)$('rec').textContent='Собрано звёзд: '+total;

g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(0,BH/2+8,48,8,0,0,7);g.fill();

g.fillStyle=lin(g,0,yt-6,0,yt+4,[[0,'#fff6b0'],[1,'#d89a20']]);g.beginPath();g.ellipse(0,yt,42,6*o,0,0,7);g.fill()}
rr(g,-46,yt,92,40,6);g.fillStyle=lin(g,0,yt,0,yt+40,[[0,'#ffe27a'],[.4,'#d9a020'],[1,'#8a5a00']]);g.fill();g.lineWidth=2;g.strokeStyle='#6b4400';g.stroke();

g.fillStyle='rgba(255,255,255,.25)';rr(g,-44,yt+2,88,5,2.5);g.fill();

g.beginPath();g.moveTo(0,0);g.lineTo(0,-10);g.quadraticCurveTo(0,-26,24,-26);g.lineTo(72,-26);g.quadraticCurveTo(96,-26,96,-10);g.lineTo(96,0);g.closePath();

function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;time+=dt;
ph+=dt*speed*(openT>0?.25:1)*(run?1:.6);

const o=openT>0?(openT<.15?(1-Math.pow(1-openT/.15,2)):openT>.7?1-(openT-.7)/.3:1):0;
pulse=Math.max(0,pulse-dt*4);
const mx=(w-BWs)/2-6,y0=stD+125,y1=h-BHs/2-18;

byy=(y0+y1)/2+(y1-y0)/2*(.6*Math.sin(ph*2.6+2)+.4*Math.sin(ph*4.4));
g.setTransform(1,0,0,1,0,0);g.drawImage(bg,0,0);g.setTransform(D*u,0,0,D*u,0,0);
g.save();g.globalCompositeOperation='lighter';
for(const m of motes){const x=m[0]*w+Math.sin(time*.4+m[0]*9)*18,y=h-((time*10*m[2]+m[1]*h)%h);g.fillStyle=`rgba(255,220,130,${.12+.1*Math.sin(time*2+m[0]*20)})`;g.beginPath();g.arc(x,y,m[3],0,7);g.fill()}
const gl=(Math.sin(time*2.2)+1)/2;g.translate(SX-11,SY-13);g.fillStyle=`rgba(255,255,255,${.3+.7*gl})`;glint(g,10+14*gl);g.restore();
hud();
const SH=h*.3+70;
g.lineCap='round';
for(const s of[-1,1]){const hx=bxx+s*(BWs/2+3),hy2=byy+10*BS,sx=w/2+s*86,qx=(sx+hx)/2+s*40,qy=(SH+hy2)/2+10;
g.beginPath();g.moveTo(sx,SH);g.quadraticCurveTo(qx,qy,hx,hy2);
g.strokeStyle='#1f1560';g.lineWidth=40;g.stroke();g.strokeStyle='#3d2a8c';g.lineWidth=32;g.stroke();g.strokeStyle='rgba(120,90,200,.55)';g.lineWidth=11;g.stroke();
g.fillStyle=gold(g,hx-19,hy2-19,hx+19,hy2+19);g.beginPath();g.arc(hx,hy2,19,0,7);g.fill();g.lineWidth=1.5;g.strokeStyle='#6b4400';g.stroke()}
drawBox(bxx,byy,o,time);
for(const s of[-1,1]){const hx=bxx+s*(BWs/2+3),hy2=byy+10*BS;
g.save();g.translate(hx,hy2);g.scale(1.3,1.3);const q=g.createRadialGradient(-2,-3,1,0,0,12);q.addColorStop(0,'#ffe3c4');q.addColorStop(1,'#d99a6c');
g.fillStyle=q;g.beginPath();g.ellipse(0,0,9,12,s*.2,0,7);g.fill();g.strokeStyle='rgba(120,60,30,.45)';g.lineWidth=1;g.beginPath();g.moveTo(-s*4,-5);g.lineTo(-s*4,6);g.stroke();g.restore()}
if(!openT){g.save();g.globalCompositeOperation='lighter';g.translate(bxx-30*BS,byy-24*BS);g.fillStyle=`rgba(255,255,255,${.2+.7*(Math.sin(time*3+1)+1)/2})`;glint(g,9*BS);g.restore()}
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;p.rot+=dt*4;
if(p.t<p.d){const f=Math.pow(.04,dt);p.vx*=f;p.vy*=f;p.x+=p.vx*dt;p.y+=p.vy*dt}
else{p.sp+=dt*3200;const dx=TX-p.x,dy=TY-p.y,d=Math.hypot(dx,dy),s=p.sp*dt;
if(d<=s+14){shown++;pulse=1;parts.splice(i,1);burst(TX,TY,6);pingSfx();continue}p.x+=dx/d*s;p.y+=dy/d*s}
if(R()<.8)sparks.push({x:p.x,y:p.y,vx:(R()-.5)*60,vy:(R()-.5)*60,l:0,m:.35,c:'#bff',r:2.2,g:0,k:0});
diamond(p.x,p.y,p.r,p.rot)}
if(!parts.length&&shown<total)shown=total;
if(won&&!fin&&!parts.length&&shown>=total&&openT===0)showWin();
if(fin&&R()<.12)burst(R()*w,h*.45,14);
g.globalCompositeOperation='lighter';
for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.l+=dt;if(s.l>=s.m){sparks.splice(i,1);continue}s.vy+=s.g*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;const a=1-s.l/s.m;g.globalAlpha=a;g.fillStyle=s.c;g.beginPath();
if(s.k)g.ellipse(s.x,s.y,s.r*2.2*Math.abs(Math.cos(s.l*14))+.5,s.r*2.2,0,0,7);else g.arc(s.x,s.y,s.r*a+.5,0,7);g.fill()}
g.globalAlpha=1;g.globalCompositeOperation='source-over';
if(run&&hintT>0){hintT-=dt;g.save();g.globalAlpha=Math.min(1,hintT)*(.7+.3*Math.sin(time*5));g.font='bold 20px Georgia,serif';g.textAlign='center';g.fillStyle='#ffe9a0';g.shadowColor='#000';g.shadowBlur=8;g.fillText('Тапни по шкатулке!',w/2,stD+68);g.restore()}}
