function sched(){if(!ac)return;if(nextT<ac.currentTime)nextT=ac.currentTime+.05;
while(nextT<ac.currentTime+.3){const k=step%N,e=ML[k],c=CD[PR[(k/8)|0]],t=nextT;
if(e&&e[0]){const f=mf(e[0]),d=e[1]*SD;tone('square',f,t,d*.92,.07,lp);tone('triangle',f,t,d*.92,.1,lp)}
if(k%2==0)tone('triangle',mf(c[0]),t,SD*.9,.28,mus);else{c[1].forEach(n=>tone('square',mf(n),t,SD*.45,.03,lp));hat(t,.04)}
nextT+=SD;step++}}
function initAudio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null;return}
master=ac.createGain();master.gain.value=muted?0:.85;const cp=ac.createDynamicsCompressor();master.connect(cp);cp.connect(ac.destination);
mus=ac.createGain();mus.gain.value=.55;mus.connect(master);lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;lp.connect(mus);
nb=ac.createBuffer(1,ac.sampleRate*.1|0,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;
nextT=ac.currentTime+.1;setInterval(sched,60)}

for(let i=0;i<18;i++){const n=84+sc[R()*8|0],tt=t+i*.045+R()*.02;tone('sine',mf(n),tt,.5,.12,master);tone('triangle',mf(n+12),tt,.25,.04,master);if(i%3==0)hat(tt,.05,9000)}
tone('square',1318.5,t,.14,.07,master);tone('square',1760,t+.09,.5,.07,master);tone('sine',mf(72),t,1.2,.1,master);tone('sine',mf(79),t+.05,1.2,.08,master)}

async function buyStars(i){
if(loading)return;
if(!TW||!TW.initData||typeof TW.openInvoice!=='function'){toast('Оплата Stars доступна только внутри Telegram');return}
loading=i.id;shop();
const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),60000);
try{
const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:i.n,description:i.d,payload:i.id,price:i.s}),signal:ctl.signal});
const r=await res.json();

if(!r||!r.ok||!r.invoiceLink)throw new Error('bad response');

TW.openInvoice(r.invoiceLink,status=>{
